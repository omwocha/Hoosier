<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Album — APNAD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/apnad.css" />
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <h1>Photo Album</h1>
    <p>Moments from our gatherings — conventions, ordinations, retreats, and the everyday faces of pastoral fellowship across the division.</p>
  </section>

  <section class="section">
    <div class="container">
      <div class="album-filter" id="albumFilter"></div>
      <div class="album-grid" id="albumGrid"></div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Photo viewer">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
